  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;

}

.form-range:focus-visible::-moz-range-thumb {

  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {

.btn:not(.btn-primary, .viz-tile):is(

  ) {

}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {

  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;body&gt;
&lt;div id=&quot;acoustic-atlas&quot; data-view=&quot;0&quot;&gt;
  &lt;style&gt;
    @import url(&quot;https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=Manrope:wght@400;500&amp;display=swap&quot;);

    #acoustic-atlas {

          &lt;button type=&quot;button&quot; class=&quot;atlas-icon-btn&quot; id=&quot;atlas-next&quot; aria-label=&quot;Следующая глава&quot;&gt;→&lt;/button&gt;

  &lt;script&gt;
    (function () {
      var root = document.getElementById(&quot;acoustic-atlas&quot;);
      if (!root) return;

      var slides = Array.prototype.slice.call(root.querySelectorAll(&quot;[data-atlas-slide]&quot;));
      var viewButtons = Array.prototype.slice.call(root.querySelectorAll(&quot;[data-atlas-view]&quot;));
      var prev = root.querySelector(&quot;#atlas-prev&quot;);
      var next = root.querySelector(&quot;#atlas-next&quot;);
      var page = root.querySelector(&quot;#atlas-page&quot;);
      var footerTitle = root.querySelector(&quot;#atlas-footer-title&quot;);
      var progress = root.querySelector(&quot;#atlas-progress&quot;);
      var mobileChapter = root.querySelector(&quot;#atlas-mobile-chapter&quot;);
      var activeView = 0;
      var viewNames = [&quot;Атлас / обзор&quot;, &quot;Теория / передача&quot;, &quot;Конструкция / слои&quot;, &quot;Материалы / границы&quot;, &quot;Лаборатория / протокол&quot;];
      var mobileNames = [&quot;Атлас&quot;, &quot;Теория&quot;, &quot;Конструкция&quot;, &quot;Материалы&quot;, &quot;Лаборатория&quot;];

      function pad(value) {
        return String(value).padStart(2, &quot;0&quot;);
      }

      function setView(index) {
        activeView = Math.max(0, Math.min(slides.length - 1, Number(index)));
        root.setAttribute(&quot;data-view&quot;, String(activeView));
        slides.forEach(function (slide, i) {
          var selected = i === activeView;
          slide.classList.toggle(&quot;is-active&quot;, selected);
          slide.setAttribute(&quot;aria-hidden&quot;, selected ? &quot;false&quot; : &quot;true&quot;);
        });
        viewButtons.forEach(function (button) {
          button.setAttribute(&quot;aria-pressed&quot;, Number(button.getAttribute(&quot;data-atlas-view&quot;)) === activeView ? &quot;true&quot; : &quot;false&quot;);
        });
        prev.disabled = activeView === 0;
        next.disabled = activeView === slides.length - 1;
        page.textContent = pad(activeView + 1) + &quot; / &quot; + pad(slides.length);
        footerTitle.textContent = viewNames[activeView];
        mobileChapter.textContent = pad(activeView + 1) + &quot; / &quot; + mobileNames[activeView];
        progress.style.setProperty(&quot;--progress&quot;, (((activeView + 1) / slides.length) * 100) + &quot;%&quot;);
      }

      viewButtons.forEach(function (button) {
        button.addEventListener(&quot;click&quot;, function () {
          setView(button.getAttribute(&quot;data-atlas-view&quot;));
        });
      });
      prev.addEventListener(&quot;click&quot;, function () { setView(activeView - 1); });
      next.addEventListener(&quot;click&quot;, function () { setView(activeView + 1); });
      root.addEventListener(&quot;keydown&quot;, function (event) {
        if (event.key === &quot;ArrowLeft&quot;) setView(activeView - 1);
        if (event.key === &quot;ArrowRight&quot;) setView(activeView + 1);
      });

      var theoryData = [
        [&quot;Воздушная волна&quot;, &quot;Звуковая энергия — периодические колебания воздуха. Волна подходит к твёрдой границе и передаёт ей импульс.&quot;],
        [&quot;Микровибрация перегородки&quot;, &quot;Стена не абсолютно жёсткая: под действием звука она начинает колебаться, хотя это движение не видно глазом.&quot;],
        [&quot;Переизлучение&quot;, &quot;Обратная сторона перегородки работает как большая мембрана динамика и снова возбуждает воздух соседнего помещения.&quot;],
        [&quot;Повышенный импеданс&quot;, &quot;Мягкая вязкая прослойка усложняет контакт стены с воздухом и рассеивает часть энергии внутри волокон.&quot;]
      ];
      var theoryButtons = Array.prototype.slice.call(root.querySelectorAll(&quot;[data-theory-step]&quot;));
      var theoryLab = root.querySelector(&quot;.atlas-wave-lab&quot;);
      var theoryTitle = root.querySelector(&quot;#atlas-theory-title&quot;);
      var theoryCopy = root.querySelector(&quot;#atlas-theory-copy&quot;);
      theoryButtons.forEach(function (button) {
        button.addEventListener(&quot;click&quot;, function () {
          var index = Number(button.getAttribute(&quot;data-theory-step&quot;));
          theoryButtons.forEach(function (item, i) { item.setAttribute(&quot;aria-pressed&quot;, i === index ? &quot;true&quot; : &quot;false&quot;); });
          theoryLab.setAttribute(&quot;data-step&quot;, String(index));
          theoryTitle.textContent = theoryData[index][0];
          theoryCopy.textContent = theoryData[index][1];
        });
      });

      var layerButtons = Array.prototype.slice.call(root.querySelectorAll(&quot;[data-layer-focus]&quot;));
      var exploded = root.querySelector(&quot;#atlas-exploded-svg&quot;);
      layerButtons.forEach(function (button) {
        button.addEventListener(&quot;click&quot;, function () {
          var focus = button.getAttribute(&quot;data-layer-focus&quot;);
          exploded.setAttribute(&quot;data-focus&quot;, focus);
          layerButtons.forEach(function (item) { item.setAttribute(&quot;aria-pressed&quot;, item === button ? &quot;true&quot; : &quot;false&quot;); });
        });
      });

      setView(0);
    })();
  &lt;/script&gt;

  &lt;script type=&quot;module&quot;&gt;
    import * as THREE from &quot;https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js&quot;;

    const root = document.getElementById(&quot;acoustic-atlas&quot;);
    const canvas = root ? root.querySelector(&quot;#atlas-3d&quot;) : null;
    const wrap = root ? root.querySelector(&quot;#atlas-model-wrap&quot;) : null;
    const explode = root ? root.querySelector(&quot;#atlas-explode&quot;) : null;

    if (root &amp;&amp; canvas &amp;&amp; wrap &amp;&amp; explode) {
      const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
      camera.position.set(8.2, 4.4, 7.2);
      camera.lookAt(0, 0, 0);

      const assembly = new THREE.Group();
      assembly.rotation.set(-0.08, 0.46, 0.02);
      scene.add(assembly);

      scene.add(new THREE.HemisphereLight(0xfffbec, 0x665b45, 2.2));
      const key = new THREE.DirectionalLight(0xffffff, 3.2);
      key.position.set(5, 8, 6);
      key.castShadow = true;
      scene.add(key);
      const rim = new THREE.DirectionalLight(0xb79b62, 1.35);
      rim.position.set(-5, 2, -6);
      scene.add(rim);

      const woolCanvas = document.createElement(&quot;canvas&quot;);
      woolCanvas.width = 128;
      woolCanvas.height = 128;
      const woolContext = woolCanvas.getContext(&quot;2d&quot;);
      woolContext.fillStyle = &quot;#b59a64&quot;;
      woolContext.fillRect(0, 0, 128, 128);
      for (let i = 0; i &lt; 900; i += 1) {
        const lightness = 95 + Math.floor(Math.random() * 90);
        woolContext.fillStyle = &quot;rgba(&quot; + lightness + &quot;,&quot; + (lightness - 24) + &quot;,&quot; + (lightness - 62) + &quot;,.34)&quot;;
        woolContext.fillRect(Math.random() * 128, Math.random() * 128, 1 + Math.random() * 4, 1 + Math.random() * 2);
      }
      const woolTexture = new THREE.CanvasTexture(woolCanvas);
      woolTexture.colorSpace = THREE.SRGBColorSpace;

      const fabricCanvas = document.createElement(&quot;canvas&quot;);
      fabricCanvas.width = 64;
      fabricCanvas.height = 64;
      const fabricContext = fabricCanvas.getContext(&quot;2d&quot;);
      fabricContext.fillStyle = &quot;#ded8ca&quot;;
      fabricContext.fillRect(0, 0, 64, 64);
      fabricContext.strokeStyle = &quot;rgba(55,61,52,.16)&quot;;
      fabricContext.lineWidth = 1;
      for (let i = 0; i &lt; 64; i += 3) {
        fabricContext.beginPath();
        fabricContext.moveTo(i, 0);
        fabricContext.lineTo(i, 64);
        fabricContext.stroke();
        fabricContext.beginPath();
        fabricContext.moveTo(0, i);
        fabricContext.lineTo(64, i);
        fabricContext.stroke();
      }
      const fabricTexture = new THREE.CanvasTexture(fabricCanvas);
      fabricTexture.colorSpace = THREE.SRGBColorSpace;

      const layerMeshes = [];
      const layerSpecs = [
        { name: &quot;board-back&quot;, thickness: 0.14, color: 0xd7d0bf, roughness: 0.92 },
        { name: &quot;membrane&quot;, thickness: 0.08, color: 0x34352f, roughness: 0.72 },
        { name: &quot;wool&quot;, thickness: 0.34, color: 0xb59a64, roughness: 1, map: woolTexture },
        { name: &quot;felt&quot;, thickness: 0.12, color: 0x676255, roughness: 0.96 },
        { name: &quot;fabric&quot;, thickness: 0.08, color: 0xded8ca, roughness: 0.92, map: fabricTexture },
        { name: &quot;board-front&quot;, thickness: 0.14, color: 0xe7e1d4, roughness: 0.88 }
      ];

      layerSpecs.forEach(function (spec, index) {
        const geometry = new THREE.BoxGeometry(spec.thickness, 4.3, 3.15);
        const material = new THREE.MeshStandardMaterial({
          color: spec.color,
          roughness: spec.roughness,
          metalness: 0.02,
          map: spec.map || null
        });

        mesh.castShadow = true;
        mesh.receiveShadow = true;

      const frameMaterial = new THREE.MeshStandardMaterial({ color: 0x81745c, roughness: 0.38, metalness: 0.72 });

      let lastY = 0;

        lastY = event.clientY;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;

  if (window.FloatingUIDOM == null) {
    return;

    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;

  const getTooltip = () =&gt; {

      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);

    );

    }
    pendingTrigger = null;

  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();

    if (activeTrigger == null) {
      return;
    }

    activeTrigger = null;

      middleware: [
        offset(tooltipGap),

        shift({ padding: tooltipGap }),

          padding: tooltipGap,

              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,

      .then(({ x, y }) =&gt; {

        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;

  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);

  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);

  const handlePointerOpen = (event) =&gt; {

    }

    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {

    }

  const handleContextMenu = (event) =&gt; {

  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
